<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Météo - Graphiques personnalisés (36h)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8ff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .chart-container {
            margin: 20px 0;
            height: 300px;
        }
        .last-update {
            text-align: center;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Station Météo - Graphiques personnalisés (36h)</h1>

        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="humidityChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="pressureChart"></canvas>
        </div>

        <p class="last-update">Dernière mise à jour: <span id="last-update-time">--</span></p>
    </div>

    <script>
        // Configuration ThingSpeak
        const CHANNEL_ID = "3448620";
        const READ_API_KEY = "HVPX29I97P3P2R07";  // Optionnel (si ton canal est privé)

        // Variables pour stocker les graphiques
        let temperatureChart, humidityChart, pressureChart;

        // Fonction pour récupérer les données depuis ThingSpeak
        async function fetchData() {
            // Récupère jusqu'à 1000 résultats (pour couvrir 36h même si les données sont envoyées en retard)
            const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&results=1000`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.feeds;
            } catch (error) {
                console.error("Erreur lors de la récupération des données:", error);
                return [];
            }
        }

        // Fonction pour formater les données pour Chart.js (avec heure locale)
        function formatData(feeds) {
            // Filtre les entrées valides (avec des données) et convertit les timestamps en heure locale
            const validFeeds = feeds.filter(feed => feed.field1 && feed.field2 && feed.field3);

            // Filtre pour ne garder que les 36 dernières heures (en heure locale)
            const now = new Date();
            const thirtySixHoursAgo = new Date(now.getTime() - 36 * 60 * 60 * 1000); // 36h en arrière

            const filteredFeeds = validFeeds.filter(feed => {
                const feedDate = new Date(feed.created_at);
                return feedDate >= thirtySixHoursAgo;
            });

            // Trie par date (au cas où les données ne seraient pas dans l'ordre)
            filteredFeeds.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            // Extrait les timestamps en heure locale et les valeurs
            const timestamps = filteredFeeds.map(feed => {
                return new Date(feed.created_at).toLocaleString(); // Heure locale
            });
            const temperatures = filteredFeeds.map(feed => parseFloat(feed.field1));
            const humidities = filteredFeeds.map(feed => parseFloat(feed.field2));
            const pressures = filteredFeeds.map(feed => parseFloat(feed.field3));

            return { timestamps, temperatures, humidities, pressures };
        }

        // Fonction pour créer ou mettre à jour les graphiques
        function updateCharts(timestamps, temperatures, humidities, pressures) {
            // Met à jour l'heure de la dernière mise à jour
            document.getElementById("last-update-time").textContent = new Date().toLocaleString();

            // Crée ou met à jour le graphique de température
            const tempCtx = document.getElementById('temperatureChart').getContext('2d');
            if (temperatureChart) {
                temperatureChart.destroy();
            }
            temperatureChart = new Chart(tempCtx, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [{
                        label: 'Température (°C)',
                        data: temperatures,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Température (°C)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Heure (locale)'
                            }
                        }
                    }
                }
            });

            // Crée ou met à jour le graphique d'humidité
            const humidityCtx = document.getElementById('humidityChart').getContext('2d');
            if (humidityChart) {
                humidityChart.destroy();
            }
            humidityChart = new Chart(humidityCtx, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [{
                        label: 'Humidité (%)',
                        data: humidities,
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Humidité (%)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Heure (locale)'
                            }
                        }
                    }
                }
            });

            // Crée ou met à jour le graphique de pression
            const pressureCtx = document.getElementById('pressureChart').getContext('2d');
            if (pressureChart) {
                pressureChart.destroy();
            }
            pressureChart = new Chart(pressureCtx, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [{
                        label: 'Pression (hPa)',
                        data: pressures,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Pression (hPa)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Heure (locale)'
                            }
                        }
                    }
                }
            });
        }

        // Fonction principale pour récupérer et afficher les données
        async function updateData() {
            const feeds = await fetchData();
            if (feeds.length > 0) {
                const { timestamps, temperatures, humidities, pressures } = formatData(feeds);
                updateCharts(timestamps, temperatures, humidities, pressures);
            }
        }

        // Met à jour les données toutes les 5 minutes (300 000 ms)
        updateData();  // Première mise à jour
        setInterval(updateData, 300000);
    </script>
</body>
</html>
